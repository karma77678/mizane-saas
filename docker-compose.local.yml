services:
  postgres:
    image: postgres:16-alpine
    container_name: mizan-postgres-local
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan_dev_only
    ports:
      - "5432:5432"
    volumes:
      - mizan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan -d mizan"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  mizan_postgres_data:
