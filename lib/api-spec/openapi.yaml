openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: audit
    description: Analyse assistée des constats comptables agrégés
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /audit/ai-review:
    post:
      operationId: reviewAuditWithAi
      tags: [audit]
      summary: Prioritise des constats comptables agrégés
      description: >
        Produit une explication indicative à partir de totaux et de catégories
        de constats. Ne transmet aucun journal ni aucune ligne comptable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditAiReviewInput"
      responses:
        "200":
          description: Synthèse indicative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditAiReview"
        "400":
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Analyse IA momentanément indisponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Limite de requêtes IA atteinte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AuditFindingDigest:
      type: object
      properties:
        ruleCode:
          type: string
          minLength: 1
          maxLength: 80
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        occurrences:
          type: integer
          minimum: 0
      required: [ruleCode, severity, occurrences]
    AuditAiReviewInput:
      type: object
      properties:
        fiscalYear:
          type: integer
          minimum: 1990
          maximum: 2100
        sector:
          type: string
          maxLength: 100
        summary:
          type: object
          properties:
            entryCount:
              type: integer
              minimum: 0
            totalDebit:
              type: number
            totalCredit:
              type: number
            balanceDifference:
              type: number
            findingsCount:
              type: integer
              minimum: 0
          required: [entryCount, totalDebit, totalCredit, balanceDifference, findingsCount]
        findings:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/AuditFindingDigest"
      required: [fiscalYear, summary, findings]
    AuditAiPriority:
      type: object
      properties:
        title:
          type: string
        explanation:
          type: string
        suggestedAction:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        relatedRuleCodes:
          type: array
          items:
            type: string
      required: [title, explanation, suggestedAction, severity, relatedRuleCodes]
    AuditAiReview:
      type: object
      properties:
        executiveSummary:
          type: string
        priorities:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/AuditAiPriority"
        limitations:
          type: string
      required: [executiveSummary, priorities, limitations]

